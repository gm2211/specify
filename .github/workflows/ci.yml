name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - name: Check intent review against PR base
        if: github.event_name == 'pull_request'
        env:
          INTENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: node dist/src/cli/index.js intent check --base "$INTENT_BASE"
