name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - name: Check spec review against PR base
        if: github.event_name == 'pull_request'
        env:
          SPEC_BASE: ${{ github.event.pull_request.base.sha }}
          SPEC_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          reason=$(printf '%s\n' "$SPEC_PR_BODY" | sed -n 's/^Spec review: //p' | head -n 1)
          args=()
          if [ -n "$reason" ]; then args=(--reason "$reason"); fi
          node dist/src/cli/index.js spec check --spec specify.spec --base "$SPEC_BASE" "${args[@]}"
