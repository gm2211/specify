name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - name: Validate OpenSpec specs
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npx --yes @fission-ai/openspec@1.16.0 validate --specs --strict
  formal-example:
    uses: ./.github/workflows/formal.yml
    with:
      root: examples/counter
      specify-ref: ${{ github.event.pull_request.head.sha || github.sha }}
