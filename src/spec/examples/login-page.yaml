version: '2'
name: Account access
target:
  type: web
  url: http://localhost:3000
variables:
  member_email: member@example.com
assumptions:
  - description: A test member exists and the verifier has its password.
areas:
  - id: authentication
    name: Authentication
    behaviors:
      - id: valid-login
        description: A member using {{member_email}} and the correct password reaches the dashboard.
      - id: invalid-login
        description: An incorrect password leaves the visitor signed out and displays an error.
      - id: logout
        description: Signing out prevents access to protected pages until the member signs in again.
