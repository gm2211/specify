version: '2'
name: Checkout
target:
  type: web
  url: http://localhost:3000
assumptions:
  - description:
      A disposable test account and an in-stock product are available; payments use a test provider.
areas:
  - id: cart
    name: Shopping cart
    behaviors:
      - id: retains-items
        description:
          Items added to the cart remain there when the customer visits checkout and returns to the
          cart.
      - id: quantity-updates-total
        description:
          Changing an item's quantity updates the cart total using the displayed unit price.
  - id: checkout
    name: Checkout
    behaviors:
      - id: payment-failure
        description:
          A declined payment leaves the cart available for retry and does not create a paid order.
      - id: successful-order
        description:
          A successful payment creates exactly one paid order and shows its confirmation to the
          customer.
        details: Refreshing the confirmation page must not charge the customer again.
