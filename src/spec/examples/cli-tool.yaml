version: '2'
name: Example CLI
target:
  type: cli
  binary: ./example-cli
areas:
  - id: help
    name: Help and version
    behaviors:
      - id: help-output
        description: Running with --help exits successfully and prints available commands.
      - id: version-output
        description: Running with --version exits successfully and prints the installed version.
      - id: unknown-command
        description: An unknown command exits nonzero and prints an actionable error.
