version: '2'
name: Dashboard API
target:
  type: api
  url: http://localhost:3000/api
assumptions:
  - description: The verifier has a test user's token and the test account has known activity data.
areas:
  - id: dashboard
    name: Dashboard statistics
    behaviors:
      - id: authorized-statistics
        description:
          An authenticated request to GET /stats returns HTTP 200 and statistics for the requesting
          account.
        details:
          The response contains numeric totalUsers and activeUsers values; neither can be negative.
      - id: requires-authentication
        description:
          A request to GET /stats without authentication returns HTTP 401 and no account statistics.
      - id: account-isolation
        description: Statistics for one account never include activity belonging to another account.
