version: '2'
name: Specify CLI
description: >-
  Behavioral contracts with stable IDs, structural linting, deterministic context projection,
  external result validation, and static evidence reports. External tools own implementation and
  test execution.
target:
  type: cli
  binary: ./specify
areas:
  - areas/overview.yaml
  - areas/spec-lint.yaml
  - areas/spec-split.yaml
  - areas/spec-guide.yaml
  - areas/spec-context.yaml
  - areas/schema.yaml
  - areas/verify.yaml
  - areas/prove.yaml
  - areas/mcp-server.yaml
  - areas/error-handling.yaml
  - areas/auto-discovery.yaml
