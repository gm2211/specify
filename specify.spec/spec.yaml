version: "2"
name: Specify CLI
description: >
  Behavioral contract for the Specify CLI. Specify is an autonomous agent-driven platform for spec-first web application
  verification. It captures application behavior, generates specifications, and verifies implementations against those
  specs.
target:
  type: cli
  binary: ./specify
areas:
  - areas/overview.yaml
  - areas/spec-lint.yaml
  - areas/spec-generate.yaml
  - areas/spec-split.yaml
  - areas/spec-guide.yaml
  - areas/spec-migrate-id.yaml
  - areas/spec-compile.yaml
  - areas/schema.yaml
  - areas/capture.yaml
  - areas/verify.yaml
  - areas/replay.yaml
  - areas/compare.yaml
  - areas/review.yaml
  - areas/create.yaml
  - areas/human-mode.yaml
  - areas/daemon.yaml
  - areas/deploy.yaml
  - areas/mcp-server.yaml
  - areas/error-handling.yaml
  - areas/auto-discovery.yaml
