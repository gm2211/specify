id: capture
name: Capture
prose: >
  Agent mode (default) launches an autonomous agent to explore a URL and generate a spec. Human mode (--human) opens a
  headed browser for manual recording.
behaviors:
  - id: capture-requires-url
    description: |
      Without --url, outputs error JSON with missing_parameter and exits 10
  - id: capture-validates-url
    description: |
      Invalid --url outputs error JSON with invalid_url and exits 10
  - id: capture-agent-generates-spec
    description: |
      Agent explores the URL and writes a v2 spec to --spec-output
  - id: capture-headed-mode
    description: |
      --headed runs browser visibly instead of headless
  - id: capture-no-generate
    description: |
      --no-generate skips automatic spec generation
  - id: capture-human-mode
    description: |
      --human opens a headed browser for manual recording with traffic capture
  - id: capture-outputs-json
    description: |
      Outputs JSON to stdout with result, costUsd, outputDir, and area count
  - id: capture-shows-next-step
    description: |
      After success, stderr shows hint about 'specify review --spec <path>'
  - id: capture-storage-state
    description: >
      --storage-state <path|keychain:name> loads a saved browser session (cookies/localStorage) before capturing, in
      both agent and --human modes; an unreadable file or invalid JSON fails with a structured error and exits 10
  - id: capture-save-storage-state
    description: >
      --save-storage-state <path|keychain:name> persists the browser session at the end of a successful capture, to a
      file (written with restrictive permissions) or the macOS Keychain
