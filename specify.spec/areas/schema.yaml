id: schema
name: Schema Introspection
prose: >-
  Machine-readable schema output lets agents and integrations inspect Specify's contract format and
  supported command catalog directly, without scraping help text.
behaviors:
  - id: schema-spec
    title: Machine-readable spec format
    description: |
      'specify schema spec' outputs v2 JSON Schema definition
  - id: schema-commands
    title: Machine-readable command catalog
    description: |
      'specify schema commands' outputs full command manifest
  - id: schema-unknown-target-fails
    title: Unknown schema target feedback
    description: |
      Unknown target outputs error and exits 10
