id: verify
name: External Results Validation
prose: >-
  Match externally produced test outcomes to stable contract IDs. Whole-contract checks and legacy
  selected-suite execution have explicit, different coverage boundaries.
behaviors:
  - id: verify-requires-spec
    description: |
      Without --spec and no auto-discoverable spec, outputs error and exits 10
  - id: verify-auto-discovers-spec
    description: |
      Without --spec, auto-discovers spec file (or spec directory) from cwd
  - id: verify-pass-exits-zero
    description:
      In results mode, exit 0 requires exactly one passed result for every contract behavior.
  - id: verify-fail-exits-one
    description:
      In results mode, any failed behavior exits 1, even when other behaviors lack coverage.
  - id: verify-outputs-json
    description: >-
      Structured output reports validated results, whole-contract pass, completeness, missing IDs,
      and counts derived from individual results. Supplied pass and summary fields cannot override
      these values.
  - id: verify-writes-result-file
    description: >-
      Scripted compatibility mode writes verify-result.json in --output (default .specify/verify).
      Results mode reads --report without rewriting it.
  - id: verify-mode-flag
    description: >-
      --mode accepts results (default) or scripted. Agent, auto, formal, and other removed modes
      fail with migration guidance and exit 10.
  - id: verify-scripted-mode-runs-existing-tests
    description: >-
      Scripted mode runs a caller-installed Playwright suite in --output and maps
      area/behavior-prefixed titles. It never installs dependencies or invokes a model. No matching
      tests cannot return success.
  - id: results-require-report
    description: >-
      Results mode requires --report pointing to JSON; missing report fails with exit 10 and
      explains that external tools own execution.
  - id: results-reject-invalid-identity
    description: >-
      Malformed results, duplicate behavior IDs, IDs absent from the contract, invalid statuses, and
      malformed evidence fail validation with exit 10.
  - id: results-incomplete-never-pass
    description: >-
      Missing or skipped contract behaviors prevent whole-contract pass and exit 2 unless another
      behavior failed.
  - id: results-accept-legacy-wrapper
    description: >-
      Results are accepted directly under results or in the legacy structuredOutput wrapper.
      Descriptions and contract identity are derived from the current contract.
  - id: scripted-suite-pass-is-not-contract-pass
    description: >-
      Scripted exit 0 means the matched selected suite passed. Output distinguishes suitePass from
      contract pass and completeness; untested contract IDs keep pass false.
  - id: scripted-failure-is-conservative
    description: >-
      Any failed test for a behavior prevents that behavior from passing; skipped or interrupted
      tests cannot be treated as passed, and unknown behavior IDs fail validation.
