id: intent-context
name: Intent Context Retrieval
prose: >-
  Deterministically retrieve records relevant to a query and repository paths, preserving kind and
  explicit supersession semantics.
behaviors:
  - id: intent-context-query-and-path-filters
    description: >-
      'intent context' accepts optional --query text and --paths comma,separated paths
  - id: intent-context-tokenized-query
    description: >-
      Query tokenizes text and matches records containing every token in searchable fields
  - id: intent-context-query-or-path-match
    description: >-
      When query and paths are both provided, a query match or a path match includes the record
  - id: intent-context-path-prefix-match
    description: >-
      Path selection matches exact files and overlapping directory prefixes
  - id: intent-context-always-includes-global-decisions
    description: >-
      Global decisions are included in context regardless of query or path filters
  - id: intent-context-keeps-kinds-distinct
    description: >-
      Retrieved decisions, assumptions, and proposals remain separately identified in output
  - id: intent-context-explicit-supersession-only
    description: >-
      A decision is excluded as superseded only when an explicit superseding decision names it;
      assumptions and proposals do not supersede decisions
  - id: intent-context-supports-root-and-pack
    description: >-
      --root DIR and --pack DIR select repository root and intent pack locations
