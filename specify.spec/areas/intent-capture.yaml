id: intent-capture
name: Intent Record Capture
prose: >-
  Capture immutable-by-command JSON records in an intent pack. Records preserve their statement,
  kind, source, applicability, optional behavioral links, and explicit supersession relationships.
behaviors:
  - id: intent-capture-preserves-source
    description: >-
      Captured records retain exact source.text wording and optional source.reference without
      trimming, paraphrasing, or inventing a quotation
  - id: intent-capture-input-file-or-stdin
    description: >-
      'intent capture --input file.json' reads a JSON record from a file and --input - reads stdin
  - id: intent-capture-record-shape
    description: >-
      A record requires a kebab-case id, statement, kind decision|assumption|proposal, source.text,
      and appliesTo array; source.reference, rationale, behaviorIds, and supersedes are optional
  - id: intent-capture-bounds-record-size
    description: >-
      statement is limited to 2000 characters, source.text to 8000 characters, and formatted JSON
      record to 16 KiB
  - id: intent-capture-validates-applicability
    description: >-
      appliesTo entries are exact repository-relative file paths, directory prefixes ending in /, or
      an empty array for global scope
  - id: intent-capture-validates-behavior-links
    description: >-
      Optional behaviorIds use area/behavior stable ID form
  - id: intent-capture-never-overwrites
    description: >-
      Capture creates a new record and refuses to overwrite an existing record with the same ID
  - id: intent-capture-validates-graph-before-write
    description: >-
      Capture validates the complete supersession graph before writing; malformed, dangling, or
      cyclic relations leave no new record
  - id: intent-capture-supports-root-and-pack
    description: >-
      --root DIR and --pack DIR select repository root and intent pack locations
  - id: intent-capture-preserves-record-kind
    description: >-
      Decisions, assumptions, and proposals remain distinct; implementation of a proposal does not
      promote it to a decision
