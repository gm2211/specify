id: error-handling
name: Error Handling & Exit Codes
prose: >-
  Invalid input and unsupported commands fail explicitly with stable exit codes.
behaviors:
  - id: exit-code-one-review-required
    description: Exit 1 means repository changes require an explicit reason for unchanged specs.
  - id: exit-code-zero-success
    description: Exit 0 means the invoked authoring or validation operation succeeded.
  - id: exit-code-ten-parse-error
    description: Exit 10 = argument parsing, file not found, or invalid YAML
  - id: invalid-options-fail
    description: >-
      Unknown options, repeated options, missing option values, and invalid output formats fail with
      exit 10 rather than being silently ignored.
