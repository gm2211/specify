id: spec-guide
name: Spec Authoring Guide
behaviors:
  - id: guide-documents-behavior-source
    description: >-
      The guide explains optional behavior source.text and source.reference fields for preserving
      exact user wording and its reference
  - id: guide-outputs-json
    description: |
      Outputs JSON guide with schema, examples, patterns, tips, and a capture/review/reconcile
      workflow for the calling agent
  - id: guide-reviews-conflicts
    description: >-
      The guide directs read-only agent review of new intent against relevant behaviors,
      constraints, and plans, with source-linked findings and unresolved decisions made explicit.
  - id: guide-reconciles-evidence
    description: >-
      The guide directs agents to reconcile behavior IDs against current implementation and actual
      smoke/regression evidence, report satisfied, gap, or unverified, and repeat authorized fixes
      using the existing task tracker without weakening requirements or creating another store.
  - id: guide-exits-zero
    description: |
      Exits 0
