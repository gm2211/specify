id: mcp-server
name: MCP Server
prose: >-
  Local stdio contract and intent tools. No HTTP listener, event stream, daemon client, or model
  credentials.
behaviors:
  - id: mcp-starts-stdio
    description: |
      'specify mcp' starts MCP server on stdio transport
  - id: mcp-exposes-spec-tools
    description: >
      Exposes get_authoring_guide, lint_spec, parse_spec, and spec_to_yaml — spec authoring and
      validation without shelling out to the CLI
  - id: mcp-exposes-discovery-tool
    description: |
      Exposes list_commands, returning the same command manifest as 'specify schema commands'
  - id: mcp-exposes-intent-tools
    description: >-
      Exposes initialize_intent, capture_intent, get_intent_context, reconcile_intent, and
      check_intent_review as wrappers over the same intent operations and validation as the CLI
