id: spec-context
name: Product/Design Context Generation
prose: >
  `spec context` regenerates PRODUCT.md and DESIGN.md directly from the composed spec — a
  deterministic projection, no LLM call. Content comes from the spec's area prose, behavior
  descriptions, and optional source wording and references. Every generated claim carries an inline
  `[area/behavior]` anchor back to its source. DESIGN.md additionally separates spec-derived product
  constraints (behaviors tagged design/ui/ux/visual/accessibility/a11y/style/layout/branding/theme)
  from an optional pass that extracts real visual tokens from code (tokens.json/design-tokens.json,
  CSS custom properties) — nothing is ever invented to fill either section. Regeneration is
  non-destructive: content stays inside `<!-- specify:begin/end -->` managed-region markers so hand
  edits outside them survive every run, and a target file that predates the markers is never
  silently overwritten.
behaviors:
  - id: context-projects-every-area-and-behavior-into-product-md
    title: Traceable product context
    description: >
      PRODUCT.md contains every area's prose and every behavior's description from the composed
      spec, each followed by an inline `[area-id/behavior-id]` (or `[area-id]` for area prose)
      traceability anchor
  - id: context-design-md-separates-spec-constraints-from-code-tokens
    title: Grounded design context
    description: >
      DESIGN.md has two clearly labeled sections: "Product Constraints (from spec)" — only behaviors
      tagged design/ui/ux/visual/accessibility/a11y/style/layout/branding/theme, each anchored — and
      "Visual Tokens (from code)" — tokens extracted from tokens.json/design-tokens.json or CSS
      custom properties, each labeled with its source file
  - id: context-omits-rather-than-fabricates
    title: No invented context
    description: >
      An area with no prose, a spec with no design-tagged behaviors, or a codebase with no token
      sources yields an omitted or explicitly-empty section — never invented text, colors, or values
  - id: context-regeneration-preserves-hand-edits-outside-markers
    title: Preserved edits outside managed regions
    description: >
      Re-running against an existing PRODUCT.md/DESIGN.md that has the specify managed-region
      markers replaces only the content between them; any heading, note, or section a human added
      outside the markers is untouched
  - id: context-refuses-to-clobber-unmanaged-files
    title: Safe handling of unmanaged files
    description: >
      Targeting an existing PRODUCT.md/DESIGN.md that has no specify managed-region markers does not
      overwrite it in place — instead a reviewable `<name>.proposed.<ext>` file is written alongside
      the original, which is left untouched
  - id: context-force-overwrites-unmanaged-files
    title: Explicit overwrite option
    description: |
      --force overwrites an unmanaged target file in place instead of writing a .proposed file
  - id: context-accepts-out-dir-and-filename-overrides
    title: Flexible output locations
    description: |
      --out-dir, --product, and --design control where PRODUCT.md and DESIGN.md are written
  - id: context-auto-discovers-spec
    title: Spec discovery for context generation
    description: |
      Without --spec, auto-discovers the spec file or spec directory from cwd, same as spec lint
      and spec split
  - id: context-json-emits-structured-projection
    title: Structured context output
    description: >
      In JSON output mode, emits the structured product/design projection (areas, claims, anchors,
      token extraction, per-file apply status) to stdout in addition to writing the files
