id: overview
name: Overview & Help
prose: >-
  Discover the supported contract and evidence commands through JSON introspection or human-readable
  help.
behaviors:
  - id: no-args-returns-json-manifest
    description: >-
      Running with no arguments exits 0 and outputs JSON with commands, global options, and exit
      codes.
  - id: help-flag-shows-text
    description: '--help or -h prints human-readable supported commands to stdout and exits 0.'
  - id: version-flag-shows-version
    description: |
      --version or -V outputs semver to stdout and exits 0
  - id: unknown-command-fails
    description:
      Unknown or removed commands output an error, point to migration guidance, and exit 10.
